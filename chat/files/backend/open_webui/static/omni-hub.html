<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omni</title>
  <link rel="stylesheet" href="/static/custom.css" />
  <link rel="stylesheet" href="/static/omni-pages.css" />
</head>
<body class="omni-page">
  <main class="page">
    <h1>Omni</h1>
    <p class="lead">Sign in once. Chat with the agent, or open Omni Studio. Both stay behind the same account.</p>
    <div class="grid">
      <a class="card" id="go-chat" href="/">
        <h2>Chat</h2>
        <p>Talk with the mix87 agent. Text chat on this machine, served by vLLM.</p>
        <span>Open chat</span>
      </a>
      <a class="card" id="go-studio" href="/studio">
        <h2>Omni Studio</h2>
        <p>The workspace next to chat, for the same signed-in account.</p>
        <span>Open Omni Studio</span>
      </a>
    </div>
  </main>
  <script src="/static/omni-nav.js"></script>
</body>
</html>
