<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Omni Studio</title>
  <link rel="stylesheet" href="/static/custom.css" />
  <link rel="stylesheet" href="/static/omni-pages.css" />
</head>
<body class="omni-page">
  <main class="page" id="studio-gate" hidden>
    <h1>Omni Studio</h1>
    <p class="lead">Signed in as <span id="studio-user"></span>. This is the studio. Chat with the agent stays one click away in the header.</p>
    <section class="panel">
      <h2>Same account as chat</h2>
      <p>Use the header to move between Chat and Omni Studio. Signing out returns you to the login page, and both sections ask you to sign in again.</p>
    </section>
  </main>
  <script src="/static/omni-nav.js"></script>
</body>
</html>
