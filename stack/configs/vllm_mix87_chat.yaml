# Interactive chat serve for mix87 fused MXFP4 on the 72 GiB Blackwell card.
# Voice stages are not used: this checkpoint has enable_audio_output false.
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 8
    max_num_batched_tokens: 8192
    max_model_len: 4096
    gpu_memory_utilization: 0.55
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: true
    async_scheduling: true
    tensor_parallel_size: 1
    default_sampling_params:
      temperature: 0.7
      top_p: 0.9
      top_k: 40
      max_tokens: 512
      seed: 42
      detokenize: true
      repetition_penalty: 1.05
