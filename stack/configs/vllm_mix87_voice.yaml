# mix87 speech output on the 72 GiB Blackwell card: thinker, talker, code2wav.
# Memory fractions are of the whole card and must stay distinct per stage.
async_chunk: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      initial_codec_chunk_frames: 4
      codec_chunk_frames: 25
      codec_left_context_frames: 25

stages:
  - stage_id: 0
    max_num_batched_tokens: 8192
    max_num_seqs: 4
    max_model_len: 16384
    gpu_memory_utilization: 0.50
    enforce_eager: true
    compilation_config:
      mode: 0
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    default_sampling_params:
      temperature: 0.4
      top_p: 0.9
      top_k: 1
      max_tokens: 256
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 1
    max_num_batched_tokens: 2048
    max_model_len: 2048
    max_num_seqs: 4
    gpu_memory_utilization: 0.22
    enforce_eager: true
    compilation_config:
      mode: 0
    trust_remote_code: true
    enable_prefix_caching: false
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 768
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 2
    max_num_batched_tokens: 4096
    max_model_len: 4096
    max_num_seqs: 4
    gpu_memory_utilization: 0.08
    enforce_eager: true
    compilation_config:
      mode: 0
    trust_remote_code: true
    enable_prefix_caching: false
    enable_chunked_prefill: false
    async_scheduling: false
    devices: "0"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.1
